# E04 v1: thresholds fixed before pair-growth or predictive scores are inspected.
forecast_config: configs/forecast.yaml
matching:
  distance_tolerance_m: 0.25
  angle_tolerance_deg: 15.0
  max_distance_tolerance_m: 1.0
  max_angle_tolerance_deg: 45.0
  size_factor: 0.5
  max_size_ratio: 4.0
  max_pair_cost: 0.8
  min_margin: 0.08
  nominal_tolerance_mm: 0.1
  max_component_nodes: 500
  joint_spread_tolerance_m: 0.05
  joint_number_step: 10.0
  anchor_search_m: 5.0
  anchor_length_tolerance_m: 0.20
  anchor_min_count: 3
  max_anchor_gap_m: 100.0
  max_alignment_strain: 0.03
variants: [fixed, geometry, anchored]
predictive_variants: [geometry, anchored]
baseline_models: [persistence, smooth_persistence, global_rate, local_rate, gam, catboost]
rate_models: [global, local, local_nonnegative]
min_rate_segments: 10
rate_bandwidth_m: 300.0
rate_prior_weight: 20.0
# Inspection field meanings: length/width mm, coordinates and relative distances m,
# angles degrees. Joint numbers are local grouping keys, never cross-run identity.
# Reference-name aliases and signed reference distances are deliberately not inferred.
