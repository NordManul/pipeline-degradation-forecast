[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipetwin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "pandas==2.2.3", "scikit-learn==1.5.2"]

[project.scripts]
pipetwin-e02 = "pipetwin.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
